# cargo-deny configuration

[advisories]
version = 2
yanked = "deny"
ignore = [
    "RUSTSEC-2025-0141", # bincode 1.3.3 is unmaintained
    "RUSTSEC-2024-0437", # protobuf 2.28.0 uncontrolled recursion
    # Unmaintained transitive dependencies of the Solana test/runtime stack
    # (litesvm, solana-svm, anchor). No safe upgrade exists upstream; these
    # are unmaintained-advisory exceptions only. Vulnerability advisories
    # stay enforced.
    "RUSTSEC-2021-0139", # ansi_term unmaintained (via solana-cli-config)
    "RUSTSEC-2024-0388", # derivative unmaintained (via solana account decoders)
    "RUSTSEC-2024-0436", # paste unmaintained (via solana sdk macros)
    "RUSTSEC-2025-0161", # libsecp256k1 unmaintained (via solana-syscalls/litesvm)
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "0BSD",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
