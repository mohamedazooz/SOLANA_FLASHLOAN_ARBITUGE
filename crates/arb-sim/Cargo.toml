[package]
name = "arb-sim"
version = "0.1.0"
edition = "2024"

[dependencies]
arb-types = { path = "../arb-types" }
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
base64 = { version = "0.22", features = ["alloc"] }
bincode = "1.3"
solana-transaction = { version = "4.3", features = ["serde"], optional = true }
litesvm = { version = "0.18.2", optional = true }

[features]
default = []
litesvm = ["dep:litesvm", "dep:solana-transaction"]

[lints]
workspace = true
