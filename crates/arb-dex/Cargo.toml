[package]
license.workspace = true
name = "arb-dex"
version = "0.1.0"
edition = "2024"

[dependencies]
arb-constants = { path = "../arb-constants" }
arb-math = { path = "../arb-math" }
arb-types = { path = "../arb-types" }
ruint = { workspace = true }
solana-pubkey = { workspace = true, features = ["curve25519"] }
# Orca Whirlpools core (optional; cached in registry, compatible).
orca_whirlpools_core = { version = "2.1.1", optional = true }

[features]
default = []
orca-sdk = ["dep:orca_whirlpools_core"]

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true