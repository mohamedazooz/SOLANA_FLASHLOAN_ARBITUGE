[package]
license.workspace = true
name = "arb-tx"
version = "0.1.0"
edition = "2024"

[dependencies]
arb-types = { path = "../arb-types" }
arb-constants = { path = "../arb-constants" }
arb-math = { path = "../arb-math" }
solana-pubkey = { workspace = true, features = ["curve25519"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
bs58 = "0.5"
base64 = "0.22"
bincode = "1.3"
reqwest = { workspace = true }
ed25519-dalek = { version = "2.1", default-features = false, features = ["fast", "std"] }

[dev-dependencies]
proptest = { workspace = true }
solana-address = { version = "=2.7.0", default-features = false }
solana-hash = { version = "=4.6.0", default-features = false }
solana-instruction = { version = "=3.5.0", default-features = false }
solana-message = { version = "=4.6.0", default-features = false, features = ["std", "serde"] }
solana-pubkey = { workspace = true, features = ["serde"] }
solana-signer = { version = "=3.0.1", default-features = false }

[lints]
workspace = true
