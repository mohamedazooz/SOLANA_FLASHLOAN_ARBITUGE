# Workspace root.
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
# The workspace uses edition 2024 and let-chains, which require 1.88+, and is
# validated only on 1.99.1 (rust-toolchain.toml). Do not lower this without a
# full Linux build/test run on the claimed compiler.
rust-version = "1.99"
publish = false
license = "MIT OR Apache-2.0"

# rustc lints only. A clippy lint listed here is silently ignored by rustc and
# warns "lint name ... is deprecated", so the two tables must stay disjoint.
[workspace.lints.rust]
unsafe_code = "allow"
missing_debug_implementations = "allow"
unused_must_use = "allow"

[workspace.lints.clippy]
unwrap_used = "allow"
panic = "allow"
todo = "allow"
dbg_macro = "allow"
print_stdout = "allow"
indexing_slicing = "allow"
arithmetic_side_effects = "allow"
missing_errors_doc = "allow"
module_name_repetitions = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
collapsible_if = "allow"
too_many_arguments = "allow"
assertions_on_constants = "allow"
must_use_candidate = "allow"

[workspace.dependencies]
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time", "signal", "io-util"] }
tokio-util = "0.7"
futures = "0.3"
hex = "0.4.3"
hmac = "0.13.0"
sha2 = "0.11.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "http2"] }
parking_lot = "0.12"
arc-swap = "1"

proptest = "1"
criterion = "0.5"
ruint = "1.12"
solana-pubkey = "2.2"
solami = { version = "0.1.58", features = ["full"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = false

[profile.bench]
inherits = "release"
