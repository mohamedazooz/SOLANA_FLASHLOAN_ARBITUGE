# High-volatility intermediate mints for 3-hop routes (auto-discovered if not listed)
min_net_profit_abs = 1000000        # 1,000,000 lamports (0.001 SOL = ~$0.20 USD strict floor above all fees & tip)
min_net_profit_bps = 1              # 1 bps
max_price_impact_bps = 500          # 500 bps max impact bound (relaxed for flash-loan multi-hop arbs)
hop_slippage_bps = 10               # per-hop min-out floor (bps); hard-capped at 1000 by the builders
max_state_age_slots = 300            # 300 slots state age window (~2 min) - Option 3 (HTTP-RPC only). Gated by ARB_MAX_IMPLAUSIBLE_ROI_BPS implausibility check.
graph_max_age_slots = 60             # discovery-graph horizon (capped <= max_state_age_slots)
use_flash_loan = true
max_per_venue = 33                 # top 33 most active pools per DEX venue across all 9 protocols
max_pools = 297                    # expanded ceiling for 33 pools * 9 venues = 297
discovery_refresh_secs = 60         # refreshed every 60s for multi-venue balance
discovery_min_tvl_usd = 15000.0     # $15,000 minimum TVL floor across all Solana pools

[risk]
max_trade_size_usd = 25000.0        # $25,000 max borrow size cap for safety guardrails
max_daily_loss_usd = 50.0
max_hourly_loss_usd = 20.0
max_consecutive_failures = 100
min_landing_rate = 0.0              # Statistical check requires 20+ bundles; default 0 to prevent cold-start lock
max_orders_per_hour = 1000          # High-frequency live throughput cap
max_attempts_per_slot = 16
cooldown_slots = 10                 # 10 slots breaker cooldown window
max_inflight_bundles = 32
max_tip_spend_ratio = 0.98

[store]
url = "sqlite:///app/data/shadow.db"

[metrics]
listen = "127.0.0.1:9100"

[admin]
listen = "127.0.0.1:9101"
token_env = "SENTINEL_ADMIN_KEY"

[chronos]
enabled = false                    # Bypassed on live hot path for immediate execution without theoretical decay drops
decay_lambda_per_sec = 3.0       # Hazard rate per second (λ)
max_age_ms = 800                 # 2 Solana slots latency ceiling (800ms)
min_ev_usd = 0.001               # Minimum Expected Value in USD required for execution
failed_attempt_cost_lamports = 10000  # Conservative estimate of failed attempt overhead
beta_risk_factor = 0.0005        # Hop execution risk penalty factor


