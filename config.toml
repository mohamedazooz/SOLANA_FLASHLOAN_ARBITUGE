# Sentinel Solana Arbitrage Bot Configuration
# Automatically mapped from .env infrastructure credentials

[bot]
mode = "shadow"
canary = false

[rpc]
# No endpoint fallback: provider URLs must be supplied via .env.
url = ""
commitment = "processed"

[jito]
regions = ["frankfurt", "amsterdam", "ny"]
tip_floor_percentile = "p50"
tip_share_bps = 5500
max_tip_lamports = 2000000
max_tip_share_bps = 9500
min_keep_lamports = 1000000       # 1,000,000 lamports (~$0.20 USD strict retained net profit floor)

# --- Adaptive tip pricing ---------------------------------------------------
keep_share = 0.60                 # fraction of the edge that must survive the tip
ladder_growth = 1.6               # max escalation of a retry inside one window
tip_floor_max_age_ms = 5000       # a staler snapshot is treated as no market
tip_floor_poll_ms = 1000          # the public endpoint allows 1 rps per IP
leader_gate_enabled = true        # fail-closed: reject when leader is unknown (ARB safety containment)
tip_on_unknown_leader = false
ledger_path = "data/adaptive_ledger.json"   # landing posteriors survive a restart
leader_refresh_secs = 60

