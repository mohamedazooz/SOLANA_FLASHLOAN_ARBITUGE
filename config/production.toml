# Sentinel Solana Arbitrage Bot — Production Configuration
#
# WARNING: This is a standalone legacy [bot]/[rpc] config; it does not select
# runtime mode. Live dispatch requires BotMode::Live AND ARB_LIVE=1 (truthy).
# Set ARB_MODE=live explicitly if ARB_MODE is already defined in the environment.
# The alternate AppConfig schema additionally has mode.live_enabled; that field
# is not part of this legacy schema. Never enable live until all controls pass.
# Secrets must be provided through the secret provider, never committed here.

[bot]

[rpc]
url = ""
commitment = "confirmed"

[jito]
regions = ["frankfurt", "amsterdam", "ny"]
tip_floor_percentile = "p75"
tip_share_bps = 1000
max_tip_lamports = 125000
max_tip_share_bps = 2000
min_keep_lamports = 100000
keep_share = 0.80
ladder_growth = 1.6
tip_floor_max_age_ms = 5000
tip_floor_poll_ms = 1000
leader_gate_enabled = true
leader_refresh_secs = 60

[jupiter]
base_url = "https://api.jup.ag/swap/v2"
api_key_env = "JUPITER_API_KEY"
timeout_ms = 3000

[wallet]
keypair_path = "solana_keypair.json"
cold_wallet_pubkey = ""
min_sol_balance_lamports = 10000000

[strategy]
base_tokens = [
    "So11111111111111111111111111111111111111112",
    "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v",
]
min_net_profit_abs = 50000
min_net_profit_bps = 5
max_price_impact_bps = 40
max_state_age_slots = 2
graph_max_age_slots = 8
use_flash_loan = true
max_pools = 135
discovery_refresh_secs = 60
discovery_min_tvl_usd = 25000.0

hop_slippage_bps = 10
[risk]
max_trade_size_usd = 1.5
max_daily_loss_usd = 0.10
max_hourly_loss_usd = 0.03
max_consecutive_failures = 3
min_landing_rate = 0.02
max_attempts_per_slot = 1
max_inflight_bundles = 1
max_tip_spend_ratio = 0.2
max_orders_per_hour = 30
cooldown_slots = 75

[store]
url = "sqlite://arb_sentinel.db"

[metrics]
listen = "127.0.0.1:9100"

[admin]
listen = "127.0.0.1:9101"
token_env = "SENTINEL_ADMIN_KEY"

[chronos]
enabled = true
decay_lambda_per_sec = 3.0
max_age_ms = 400
min_ev_usd = 0.01
failed_attempt_cost_lamports = 10000
beta_risk_factor = 0.0005
