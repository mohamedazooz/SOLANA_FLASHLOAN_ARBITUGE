# Sentinel Solana Arbitrage Bot — Example Configuration
# Copy to config.toml and fill in values. NEVER commit real credentials.
# Secret values must come from the secret provider (env for local dev),
# never from this file.
# This example parses as both the library Config (unknown keys ignored) and
# the arb-config AppConfig schema.

[bot]
mode = "shadow"
canary = false
live_enabled = false   # arb-config only; required for Mode::Live to be armed

[grpc]
primary_url = "https://grpc.example.com"
primary_token_env = "HELIUS_API_KEY"
failover_url = ""
failover_token_env = "SHYFT_API_KEY"
commitment = "processed"
ping_reply = true

[rpc]
url = "https://rpc.example.com"
commitment = "processed"

[jito]
regions = ["frankfurt", "amsterdam", "ny"]
tip_floor_percentile = "p50"
tip_share_bps = 5500
max_tip_lamports = 2000000
max_tip_share_bps = 7000
min_keep_lamports = 10000

# --- Adaptive tip pricing ---------------------------------------------------
keep_share = 0.60                 # fraction of the edge that must survive the tip
ladder_growth = 1.6               # max escalation of a retry inside one window
tip_floor_max_age_ms = 5000       # a staler snapshot is treated as no market
tip_floor_poll_ms = 1000          # the public endpoint allows 1 rps per IP
leader_gate_enabled = true        # fail-closed; shadow never submits
ledger_path = "data/adaptive_ledger.json"   # landing posteriors survive a restart
leader_refresh_secs = 60
swqos_fallback_hurdle_lamports = 8000
swqos_fallback_priority_fee_lamports = 2000

[jupiter]
base_url = "https://api.jup.ag/swap/v2"
api_key_env = "JUPITER_API_KEY"
timeout_ms = 400

[wallet]
keypair_path = "solana_keypair.json"
cold_wallet_pubkey = ""
min_sol_balance_lamports = 50000000

