min_net_profit_abs = 50000          # 50,000 lamports
min_net_profit_bps = 5              # 5 bps
max_price_impact_bps = 40           # 40 bps max impact bound
hop_slippage_bps = 10               # per-hop min-out floor (bps); cap 1000
max_state_age_slots = 2             # 2 slots max state age for fresh quotes
graph_max_age_slots = 8             # discovery-graph horizon (execution revalidates <= max_state_age_slots)
use_flash_loan = true
max_pools = 165                     # up to 33 pools per venue ceiling
max_per_venue = 33                  # top 33 most active pools per DEX venue
discovery_refresh_secs = 15         # refreshed every 15s
discovery_min_tvl_usd = 25000.0     # $25,000 minimum TVL floor

# Max hops per route. Each extra hop stacks another DEX fee + failure point;
# >4 hops is economically dominated by cumulative fees. Validated 2..=4.
max_route_hops = 3
# HTTP-based pool catalog discovery (Orca/Raydium/Meteora/Dexscreener/Pump.fun
# REST APIs). Default false: pools arrive via the WebSocket account-update
# stream only. Set true to re-enable HTTP catalog fetching.
http_discovery_enabled = false
contingency_buffer_lamports = 10000

[risk]
max_trade_size_usd = 10000.0        # $10,000 max borrow size cap for safety guardrails
max_daily_loss_usd = 5.0
max_hourly_loss_usd = 2.0
max_consecutive_failures = 8
min_landing_rate = 0.02
max_attempts_per_slot = 3
cooldown_slots = 75                 # 75 slots (~30s) breaker cooldown window
max_inflight_bundles = 2
max_tip_spend_ratio = 0.7
max_orders_per_hour = 120
max_implausible_roi_bps = 1500

[store]
url = "sqlite://arb_sentinel.db"

[metrics]
listen = "127.0.0.1:9100"

[admin]
listen = "127.0.0.1:9101"
token_env = "SENTINEL_ADMIN_KEY"

[security]
cors_allow_origins = []
max_request_body_bytes = 1048576
webhook_signature_required = true

[chronos]
enabled = true
decay_lambda_per_sec = 3.0
max_age_ms = 400
min_ev_usd = 0.05
failed_attempt_cost_lamports = 10000
beta_risk_factor = 0.0005
