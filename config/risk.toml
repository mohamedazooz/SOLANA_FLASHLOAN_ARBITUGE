# Sentinel Arbitrage Risk Configuration
# Classification: Operational configuration — overridable per environment.
# All values validated at startup; out-of-range values cause startup failure.

[risk]
# Trade size limits
max_trade_size_usd = 10000.0        # $10,000 max borrow size cap for safety guardrails
max_daily_loss_usd = 5.0            # $5.00 daily loss ceiling
max_hourly_loss_usd = 2.0           # $2.00 hourly loss ceiling

# Rate limits
max_consecutive_failures = 8        # Circuit breaker: open after 8 failures
min_landing_rate = 0.02             # 2% minimum historical landing rate
max_attempts_per_slot = 3           # Max bundle attempts per slot
cooldown_slots = 75                 # 75 slots (~30s) breaker cooldown window
max_inflight_bundles = 2            # Max concurrent bundles per slot
max_tip_spend_ratio = 0.7           # Tip / (tip + net) must not exceed 70%

# [risk] Chronos EV gate configuration
[risk.chronos]
decay_lambda_per_sec = 3.0          # Hazard rate per second (λ)
max_age_ms = 400                    # 1 Solana slot latency ceiling (400ms)
min_ev_usd = 0.05                   # Minimum Expected Value in USD required for execution
failed_attempt_cost_lamports = 10000  # Conservative estimate of failed attempt overhead
beta_risk_factor = 0.0005           # Hop execution risk penalty factor

# [risk] Enforced check ordering (DO NOT REORDER without audit):
# 1. Kill switch
# 2. Circuit breaker
# 3. Trade size
# 4. Velocity (orders/hour)
# 5. Tip share
# 6. Tip lamports
# 7. Price impact
# 8. State age
# 9. Minimum profit (abs + bps)
# 10. Losses (daily / hourly)
# 11. Inflight bundles
# 12. Tip spend ratio
# 13. Minimum landing rate
# The evaluate_full() and evaluate_flash_loan() methods enforce this order.