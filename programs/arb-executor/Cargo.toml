[package]
name = "arb-executor"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
no-entrypoint = []

[dependencies]
solana-address = { version = "=2.7.0", default-features = false }
solana-pubkey = { workspace = true }
solana-instruction = { version = "=3.5.0", default-features = false }
solana-account-info = { version = "=3.1.1", default-features = false }
solana-cpi = { version = "=3.1.0", default-features = false }
solana-program-error = { version = "=3.0.1", default-features = false }
solana-program-entrypoint = { version = "=3.1.1", default-features = false }
borsh = { version = "1", features = ["derive"] }
thiserror = { workspace = true }

[dev-dependencies]
arb-constants = { path = "../../crates/arb-constants" }

[lints]
workspace = true
