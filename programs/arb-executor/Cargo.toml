[package]
name = "arb-executor"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[features]
default = []
no-entrypoint = []

[dependencies]
solana-address = { version = "4.2", default-features = false }
solana-pubkey = { workspace = true }
solana-instruction = { version = "4.2", default-features = false }
solana-account-info = { version = "4.2", default-features = false }
solana-cpi = { version = "4.2", default-features = false }
solana-program-error = { version = "4.2", default-features = false }
solana-program-entrypoint = { version = "4.2", default-features = false }
solana-program = { version = "4.2", default-features = false }
borsh = { version = "1", features = ["derive"] }
thiserror = { workspace = true }

[lints]
workspace = true
