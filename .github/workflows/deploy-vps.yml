name: Deploy to VPS

# Triggered on every push to main — builds on the VPS and restarts the bot.
# Secrets required (Settings > Secrets and variables > Actions):
#   VPS_HOST        - server IP
#   VPS_USER        - SSH user
#   VPS_SSH_KEY     - ed25519 private deploy key
#   VPS_PORT        - SSH port (default 22)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: "🚀 Build & Deploy arb-bot on VPS"
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: "🔑 Connect & Deploy over SSH"
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          [ -n "${VPS_HOST}" ] && [ -n "${VPS_USER}" ] || {
            echo "::error::Set VPS_HOST and VPS_USER secrets (Settings > Secrets > Actions)"
            exit 1
          }
          PORT="${VPS_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh

          if [ -n "${VPS_SSH_KEY}" ]; then
            printf '%s\n' "${VPS_SSH_KEY}" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            SSH="ssh -i ~/.ssh/deploy_key -p ${PORT} -o StrictHostKeyChecking=accept-new -o BatchMode=yes"
          else
            echo "::error::Set VPS_SSH_KEY secret"; exit 1
          fi

          $SSH "${VPS_USER}@${VPS_HOST}" bash -s << 'REMOTE'
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          . "$HOME/.cargo/env" 2>/dev/null || true

          REPO_DIR="$HOME/SOLANA_FLASHLOAN_ARBITUGE"
          cd "$REPO_DIR"

          echo "==> [1/4] Pulling latest code from main"
          git fetch origin main
          git reset --hard origin/main
          COMMIT=$(git rev-parse --short HEAD)
          echo "==> Deploying commit: $COMMIT"

          echo "==> [2/4] Cleaning old target artifacts > 7 days"
          find target/release/deps -name '*.d' -mtime +7 -delete 2>/dev/null || true

          echo "==> [3/4] Release build (live mode — no shadow-only flag)"
          cargo build --release --locked -p arb-bot --bin arb-bot
          echo "==> Build SUCCESS: $(./target/release/arb-bot --version 2>/dev/null || echo 'binary ready')"

          echo "==> [4/4] Restart bot"
          if systemctl list-unit-files arb-bot.service &>/dev/null; then
            sudo systemctl restart arb-bot
            sleep 5
            systemctl is-active arb-bot && echo '==> arb-bot service: ACTIVE'
            journalctl -u arb-bot -n 10 --no-pager || true
          else
            pkill -f 'target/release/arb-bot' 2>/dev/null || true
            sleep 2
            mkdir -p logs data/warm
            set -a; . ./.env; set +a
            nohup ./target/release/arb-bot --mode live >> logs/arb_live.log 2>&1 &
            BOT_PID=$!
            sleep 5
            if kill -0 $BOT_PID 2>/dev/null; then
              echo "==> arb-bot running (PID: $BOT_PID)"
            else
              echo "::error::Bot failed to start — check logs/arb_live.log"
              tail -20 logs/arb_live.log || true
              exit 1
            fi
          fi

          echo "==> Deploy complete! Commit: $COMMIT"
          echo "==> Disk usage:"
          df -h / | tail -1
          REMOTE

      - name: "📊 Summary"
        if: always()
        run: |
          echo "## Deploy Results" >> "$GITHUB_STEP_SUMMARY"
          echo "- Triggered by: ${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
