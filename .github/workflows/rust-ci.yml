name: Rust CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  # Weekly re-scan: RustSec advisories appear without any repo push, so
  # push-triggered cargo-deny alone lets vulnerabilities accumulate silently.
  # Scheduled runs only execute the two security jobs.
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Format, check, test, clippy
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned Rust (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master (pinned)
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2

      - name: Verify formatting
        run: cargo fmt --all --check

      - name: Check workspace (default features)
        run: cargo check --workspace --all-targets

      - name: Check workspace (all supported features)
        # Explicit feature matrix, not --all-features: optional ingest/routing/
        # sims features are opt-in and must not be promoted by a blanket
        # --all-features gate.
        run: >-
          cargo check --workspace --all-targets
          --features arb-bot/extra-ingest,arb-ingest/extra-ingest,arb-bot/split-routing,arb-engine/split-routing,arb-sim/litesvm

      - name: Run tests
        run: cargo test --workspace --all-targets

      - name: Run Clippy
        run: >-
          cargo clippy --workspace --all-targets
          --features arb-bot/extra-ingest,arb-ingest/extra-ingest,arb-bot/split-routing,arb-engine/split-routing,arb-sim/litesvm
          -- -D warnings

  webhook-service:
    name: Webhook service (fmt, build, test, clippy)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned Rust (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master (pinned)
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: webhook-service

      - name: Verify formatting
        run: cargo fmt --manifest-path webhook-service/Cargo.toml --check

      - name: Build
        run: cargo build --manifest-path webhook-service/Cargo.toml --all-targets

      - name: Run tests
        run: cargo test --manifest-path webhook-service/Cargo.toml --all-targets

      - name: Run Clippy
        run: cargo clippy --manifest-path webhook-service/Cargo.toml --all-targets -- -D warnings

      - name: cargo-deny (webhook-service)
        uses: EmbarkStudios/cargo-deny-action@2b70cf22ed5701843749a917048c3aaaf420a7d9 # v2
        with:
          command: check advisories bans sources licenses
          manifest-path: webhook-service/Cargo.toml

  security:
    name: Security advisories (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: cargo-deny (workspace)
        uses: EmbarkStudios/cargo-deny-action@2b70cf22ed5701843749a917048c3aaaf420a7d9 # v2
        with:
          command: check advisories bans sources licenses
          arguments: --workspace

  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: gitleaks (full history, policy .gitleaks.toml)
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
        # v2 exits non-zero on any finding; the repo policy file keeps all
        # default rules active and allowlists only verified false positives.

  web:
    name: Web app build (React + Vite)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@8f152de45cc393bb48ce5d89d36b731f54556e65 # v4.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Type-check and build
        working-directory: web
        run: npm run build
