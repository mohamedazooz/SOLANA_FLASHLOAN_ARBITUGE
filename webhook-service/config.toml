# Sentinel High-Frequency Solana Webhook Service Configuration
# Runtime configuration loaded via toml crate

[server]
host = "0.0.0.0"
port = 8085
# Optional bearer token for provider authentication. Empty string disables requirement.
auth_token = "" # Set WEBHOOK_AUTH_TOKEN in the process environment
channel_buffer_size = 65536
worker_threads = 4

[dedup]
local_cache_ttl_secs = 2
redis_url = "redis://127.0.0.1:6379"
redis_ttl_ms = 5000
prune_interval_secs = 5

[filter]
drop_failed_transactions = true
min_lamport_transfer = 1000
# Filter against known DEX programs to fast-path drop uninteresting transfers
only_monitored_amms = true

[amms]
